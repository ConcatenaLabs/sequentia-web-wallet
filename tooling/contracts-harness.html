<!doctype html>
<!-- The Contracts tab of developer mode, mounted on a private regtest chain for
     tooling/contracts-regtest.mjs. It is the same module the wallet mounts
     (contracts.js), with the same context, but its network is the regtest chain
     named in the query string and its wallet is opened from the mnemonic there.
     Nothing here is used by the deployed wallet. -->
<html><head><meta charset="utf-8"><title>Contracts (regtest)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--panel:#141a21;--line:#26303a;--dim:#8fa1b3}
  body{background:#0d1117;color:#e6edf3;font:14px/1.5 system-ui,sans-serif;max-width:860px;margin:0 auto;padding:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
  .field{display:block;margin-top:12px;color:var(--dim)} .field input,.field select,.field textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px}
  .mono{font:13px/1.6 ui-monospace,monospace;word-break:break-all}
  .hide{display:none} .status.err{color:#ff7b72;margin-top:12px;white-space:pre-wrap}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .kv .k{color:var(--dim);flex:0 0 auto;max-width:45%} .kv .v{text-align:right;overflow-wrap:anywhere;min-width:0;font:13px ui-monospace,monospace}
  .contract-out{margin-top:8px;font-size:13px;overflow-wrap:anywhere}
  #contractApproval h4{margin:14px 0 4px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  button{margin-top:12px;margin-right:8px}
</style></head>
<body><h2>Contracts</h2><div id="contractsRoot"></div>
<script type="module">
import init, * as lwk from '../pkg/lwk_wasm.js'
import { mountContracts } from '../contracts.js'
const q = new URLSearchParams(location.search)
await init()
const network = lwk.Network.regtestWithGenesis(new lwk.AssetId(q.get('policy')), q.get('genesis'))
const signer = new lwk.Signer(new lwk.Mnemonic(q.get('mnemonic')), network)
const wollet = new lwk.Wollet(network, signer.wpkhSlip77Descriptor())
const hex = (a) => [...a].map(b => b.toString(16).padStart(2, '0')).join('')
const unconf = (a) => a.toUnconfidential ? a.toUnconfidential() : a
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.textContent = h; return e }
const assets = JSON.parse(q.get('assets') || '{}')
window.__wallet = { signer, network, receive: unconf(wollet.address(0).address()).toString() }
window.__contracts = mountContracts({
  lwk,
  network: () => network,
  signer: () => signer,
  esploraFetch: (path, opts) => fetch('/api' + path, opts),
  registryFetch: (path) => fetch('/registry' + path),
  walletScripts: () => [0, 1, 2].map(i => hex(unconf(wollet.address(i).address()).scriptPubkey().bytes())),
  receiveAddress: () => window.__wallet.receive,
  assetMeta: (h) => assets[h] || { ticker: h.slice(0, 8) + '…', precision: 0 },
  store: localStorage,
  el
}, document.getElementById('contractsRoot'))
window.__ready = true
</script></body></html>
